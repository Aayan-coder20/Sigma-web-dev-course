<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>

<body>
    <h1>Fitness Form</h1>
    <form action="/process.php">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your Name Here">
        <br>

        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone " placeholder="Your Phone Number">
        <br>

        <label for="pass">Password</label>
        <input type="password" id="pass" name="password" placeholder="Your Password Here">
        <br>

        <label for="cpass">Confirm Password</label>
        <input type="password" id="cpass" name="confirm password" placeholder="Confirm Your Password">
        <br><br>

        <p>Choose your gender</p>

        <label for="gender">Male</label>
        <input type="radio" id="male" name="gender" value="male">

        <label for="gender">Female</label>
        <input type="radio" name="gender" id="female" value="female">
        

        <label for="gender">Other</label>
        <input type="radio" name="gender" id="other" value="other">
        <br><br>

        <p>Choose your hobby</p>
        <label for="playing">Playing</label>
        <input type="Checkbox" name="playing" id="playing" value="playing">

        <label for="sleeping">Sleeping</label>
        <input type="Checkbox" name="sleeping" id="sleeping" value="sleeping">

        <label for="reading">Reading</label>
        <input type="Checkbox" name="reading" id="reading" value="reading">
        <br><br>

        <label for="city">Choose a city:</label>
        <select name="city" id="city">
            <option value="mumbai">Mumbai</option>
            <option value="delhi">Delhi</option>
            <option value="bangalore">Bangalore</option>
        </select>
        <br><br>

        <textarea name="description" rows="23" cols="44" id="description"></textarea>
        <br><br>


        <input type="submit" value="Submit">

    </form>
</body>

</html>
